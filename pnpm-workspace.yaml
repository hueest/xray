saveExact: true
packages:
  - 'packages/*' # published to npm (@hueest/xray)
  - 'apps/*' # deployed, never published (website, extension)
  - 'libs/*' # internal shared, workspace: only — must be bundled into any published package that uses them
allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true
  workerd: true
overrides:
  # Astro's checker needs the same runtime major as its @emnapi/core.
  '@napi-rs/wasm-runtime@1.2.4>@emnapi/runtime:peer': 1.11.3
permissions:
  '@solidjs/web':
    skills: true
  solid-js:
    skills: true
